<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KaiAlamos — 喜欢 Minecraft、自动化，以及让 Agent 真正能干活的工具。">
<title>KaiAlamos</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8edf2;
    --muted: #8b98a5;
    --accent: #5eead4;
    --accent-2: #7dd3fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(94, 234, 212, 0.10), transparent 60%),
      radial-gradient(900px 600px at 95% 10%, rgba(125, 211, 252, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 40px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    animation: rise 0.6s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .handle {
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, var(--text) 30%, var(--accent) 70%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1rem;
  }

  section { margin-top: 34px; }

  h2 {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  ul { list-style: none; display: grid; gap: 12px; }

  li {
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.025);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  li:hover {
    border-color: rgba(94, 234, 212, 0.35);
    transform: translateY(-2px);
  }

  li b { font-weight: 600; }
  li span { display: block; color: var(--muted); font-size: 0.9rem; }

  .links {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .links a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 9px 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    transition: all 0.2s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(94, 234, 212, 0.08);
  }

  footer {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 520px) {
    main { padding: 32px 24px; border-radius: 16px; }
  }
</style>
</head>
<body>
<main>
  <p class="handle">KaiAlamos</p>
  <h1>Minecraft · Agent · 自动化</h1>
  <p class="tagline">喜欢 Minecraft、自动化，以及让 Agent 真正能干活的工具。</p>

  <section>
    <h2>在折腾</h2>
    <ul>
      <li>
        <b>Kash</b>
        <span>bash 的交互层。bash 仍是执行引擎，Kash 只接管键盘、补全与渲染。</span>
      </li>
      <li>
        <b>DSH 插件</b>
        <span>给 DeepSeek Harness 的 Web 界面做增强，比如 surface-ui。</span>
      </li>
    </ul>
  </section>

  <section>
    <h2>技术栈</h2>
    <p class="tagline">Go · JavaScript / TypeScript · Python · Linux</p>
  </section>

  <div class="links">
    <a href="https://github.com/KaiAlamos" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/KaiAlamos?tab=repositories" target="_blank" rel="noopener">仓库</a>
  </div>

  <footer>© <span id="year"></span> KaiAlamos</footer>
</main>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
